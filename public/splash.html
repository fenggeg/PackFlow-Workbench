<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <title>PackFlow Workbench</title>
    <style>
      /* 与应用内设计令牌保持一致：中性底色 + 主色细条，跟随系统深浅色 */
      :root {
        --background: #fafafa;
        --foreground: #171717;
        --primary: #171717;
        --primary-foreground: #fafafa;
        --muted-foreground: #666666;
        --border: #eaeaea;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --background: #0a0a0a;
          --foreground: #ededed;
          --primary: #ededed;
          --primary-foreground: #0a0a0a;
          --muted-foreground: #a1a1a1;
          --border: #262626;
        }
      }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      body {
        width: 100vw;
        height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        background: var(--background);
        font-family: Inter, 'Segoe UI', 'Microsoft YaHei', system-ui, sans-serif;
        -webkit-font-smoothing: antialiased;
        user-select: none;
        cursor: default;
      }
      .logo {
        width: 40px; height: 40px; border-radius: 8px;
        background: var(--primary);
        color: var(--primary-foreground);
        display: flex; align-items: center; justify-content: center;
        font-size: 13px; font-weight: 600; letter-spacing: -0.01em;
        margin-bottom: 20px;
      }
      .title {
        font-size: 16px; font-weight: 600; color: var(--foreground);
        letter-spacing: -0.01em;
      }
      .subtitle {
        margin-top: 6px; font-size: 12px; color: var(--muted-foreground);
      }
      .bar {
        margin-top: 28px; width: 120px; height: 2px;
        background: var(--border); border-radius: 1px; overflow: hidden;
      }
      .bar > i {
        display: block; width: 40%; height: 100%;
        background: var(--primary); border-radius: 1px;
        animation: splash-indeterminate 1.1s ease-in-out infinite;
      }
      @keyframes splash-indeterminate {
        0% { transform: translateX(-100%); }
        100% { transform: translateX(350%); }
      }
    </style>
  </head>
  <body>
    <div class="logo">PF</div>
    <div class="title">PackFlow Workbench</div>
    <div class="subtitle">正在加载工作区…</div>
    <div class="bar"><i></i></div>
  </body>
</html>
